name = "rentalpf-relay"
main = "worker.js"
compatibility_date = "2026-01-01"

# 自有域名（workers.dev 在大陆被墙，改用已在 Cloudflare 的 zoubeacon.com）
# 若需换子域名，改这里 + 重新 `wrangler deploy`
[[routes]]
pattern = "rentalpf-relay.zoubeacon.com"
custom_domain = true

[vars]
GITHUB_REPO = "gordon310/RentalPF"
ALLOWED_ORIGIN = "https://gordon310.github.io"

# 密钥不写在此文件，用命令设置：
#   wrangler secret put GITHUB_TOKEN   # Issues: read & write
#   wrangler secret put FORM_KEY       # 提交口令（可选）
#   wrangler secret put ADMIN_KEY      # 删除记录的管理员口令
